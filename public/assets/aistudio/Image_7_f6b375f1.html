<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PIXELAB - Editor Fotográfico</title>
<!-- Tailwind CSS CDN con plugins de formularios y container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Configuración de estilos personalizados en Tailwind -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#8B5CF6',
              purpleLight: '#A78BFA',
              dark: '#121214',
              surface: '#1F1F23',
              card: '#27272D',
              border: '#323238'
            }
          },
          fontFamily: {
            sans: ['Roboto', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom CSS -->
<style data-purpose="custom-range-inputs">
    /* Estilos personalizados para los sliders de ajuste fino */
    input[type=range] {
      -webkit-appearance: none;
      background: #3A3A42;
      border-radius: 9999px;
      height: 4px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #8B5CF6;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(139, 92, 246, 0.6);
      transition: transform 0.15s ease-in-out;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    input[type=range]::-moz-range-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #8B5CF6;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(139, 92, 246, 0.6);
    }
    /* Ocultar barra de scroll en lista horizontal */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<!-- END: Custom CSS -->
</head>
<body class="bg-[#0b0b0e] text-white flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: DeviceContainer -->
<!-- Marco del teléfono Android con esquinas redondeadas -->
<main class="w-full max-w-[412px] h-[892px] bg-brand-dark rounded-[44px] shadow-2xl flex flex-col relative overflow-hidden border-[6px] border-[#2E2E36] ring-1 ring-white/10" data-purpose="android-phone-frame">
<!-- BEGIN: StatusBar -->
<!-- Barra superior de estado Android -->
<header class="w-full px-6 pt-3 pb-1 flex justify-between items-center text-xs text-neutral-300 z-30 font-medium tracking-tight" data-purpose="status-bar">
<span>9:30</span>
<div class="flex items-center gap-2">
<!-- Ícono Wifi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3c3.78 0 7.22 1.48 9.77 3.89L12 18.66 2.23 10.89C4.78 8.48 8.22 7 12 7z"></path></svg>
<!-- Ícono Red Celular -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M2 22h20V2L2 22z"></path></svg>
<!-- Ícono Batería -->
<div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">
<div class="w-3 h-full bg-current rounded-xs"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: TopAppBar -->
<!-- Barra de navegación y acciones del editor -->
<nav class="px-4 py-2 flex items-center justify-between z-20" data-purpose="app-bar">
<!-- Botón Volver -->
<button aria-label="Volver" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-white/10 active:bg-white/20 transition-colors" type="button">
<svg class="w-5 h-5 text-neutral-200" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
<!-- Nombre del proyecto editable -->
<div class="flex items-center gap-1.5 cursor-pointer group">
<span class="text-sm font-semibold tracking-wide text-neutral-100 group-hover:text-white" id="project-title">Mi edición</span>
<svg class="w-3.5 h-3.5 text-neutral-400 group-hover:text-brand-purpleLight transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Botón de Guardar -->
<button class="flex items-center gap-1.5 bg-brand-purple hover:bg-brand-purpleLight active:scale-95 transition-all text-white font-medium text-xs px-3.5 py-1.5 rounded-full shadow-lg shadow-brand-purple/20" type="button">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
<span>Guardar</span>
</button>
</nav>
<!-- END: TopAppBar -->
<!-- BEGIN: CanvasSection -->
<!-- Lienzo fotográfico central -->
<section class="relative flex-1 px-3 pt-1 pb-2 flex flex-col justify-center items-center min-h-[310px] overflow-hidden" data-purpose="photo-canvas-area">
<!-- Contenedor del marco de la imagen -->
<div class="relative w-full h-full rounded-2xl overflow-hidden shadow-inner border border-white/5 flex items-center justify-center bg-black/40">
<!-- Fotografía Atardecer Crepuscular (Diseñada fielmente con CSS Art / Gradientes fotográficos y siluetas vectoriales) -->
<div class="w-full h-full relative overflow-hidden transition-all duration-150" id="photo-preview" style="filter: brightness(1.15) contrast(1.10) saturate(1.20);">
<!-- Cielo con degradado crepuscular morado y magenta -->
<div class="absolute inset-0 bg-gradient-to-t from-[#fc8b8f] via-[#7d3c8c] to-[#201c4e]"></div>
<!-- Capa de nubes violetas -->
<div class="absolute inset-0 opacity-70 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-400/30 via-purple-700/40 to-transparent"></div>
<div class="absolute top-10 left-4 right-4 h-32 bg-gradient-to-r from-purple-400/20 via-pink-400/25 to-indigo-900/30 blur-xl"></div>
<!-- Cables eléctricos urbanos -->
<svg class="absolute inset-0 w-full h-full opacity-60 pointer-events-none" xmlns="http://www.w3.org/2000/svg">
<line stroke="#1d152c" stroke-width="1.2" x1="0" x2="400" y1="120" y2="180"></line>
<line stroke="#1d152c" stroke-width="1.4" x1="0" x2="400" y1="140" y2="200"></line>
<line stroke="#1d152c" stroke-width="1" x1="0" x2="400" y1="170" y2="215"></line>
<line stroke="#1d152c" stroke-width="0.8" x1="120" x2="380" y1="130" y2="230"></line>
</svg>
<!-- Siluetas de árboles y arquitectura urbana de la fotografía -->
<div class="absolute bottom-0 inset-x-0 h-44 flex items-end">
<!-- Árbol a la izquierda -->
<div class="w-44 h-40 bg-gradient-to-t from-[#0e0c14] to-[#1a1324] rounded-tr-[120px] rounded-tl-[90px] blur-[1px] opacity-95"></div>
<!-- Silueta de edificio a la derecha con pequeñas ventanas -->
<div class="flex-1 h-36 bg-[#16121d] relative border-l border-white/5 shadow-2xl">
<!-- Ventanas -->
<div class="absolute top-8 left-8 w-6 h-5 bg-black/60 border border-white/10 rounded-xs"></div>
<div class="absolute top-8 left-18 w-6 h-5 bg-black/60 border border-white/10 rounded-xs"></div>
</div>
</div>
</div>
<!-- Botón flotante superior derecho de pantalla dividida -->
<button aria-label="Vista dividida" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/50 backdrop-blur-md border border-white/15 flex items-center justify-center hover:bg-black/70 active:scale-95 transition-all text-white" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<rect height="16" rx="2" stroke-width="2" width="16" x="4" y="4"></rect>
<line stroke-width="2" x1="12" x2="12" y1="4" y2="20"></line>

</button>
<!-- Botón inferior flotante de 'Comparar' -->
<button class="absolute bottom-3 px-3.5 py-1.5 rounded-full bg-brand-surface/90 hover:bg-brand-surface backdrop-blur-md border border-white/10 flex items-center gap-1.5 text-xs font-medium text-neutral-200 shadow-lg active:scale-95 transition-all" id="compare-btn" type="button">
<svg class="w-3.5 h-3.5 text-brand-purple" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<rect height="16" rx="2" stroke-width="2" width="16" x="4" y="4"></rect>
<path d="M12 4v16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>Comparar</span>
</button>
</div>
</section>
<!-- END: CanvasSection -->
<!-- BEGIN: ToolCategoriesBar -->
<!-- Barra horizontal de herramientas fotográficas estilo Material 3 -->
<section class="px-3 py-2 flex items-center justify-between gap-1 overflow-x-auto no-scrollbar border-t border-white/5 bg-brand-dark" data-purpose="tools-selector">
<!-- 1. Ajustes (Activo) -->
<button class="tool-tab flex flex-col items-center gap-1 min-w-[56px] py-1 text-brand-purple" data-tool="ajustes" type="button">
<div class="w-10 h-8 rounded-xl bg-brand-purple/20 flex items-center justify-center">
<svg class="w-4 h-4 text-brand-purple" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</div>
<span class="text-[10px] font-medium tracking-tight">Ajustes</span>
</button>
<!-- 2. Recortar -->
<button class="tool-tab flex flex-col items-center gap-1 min-w-[56px] py-1 text-neutral-400 hover:text-white" data-tool="recortar" type="button">
<div class="w-10 h-8 rounded-xl flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 2v14a2 2 0 002 2h14M2 6h14a2 2 0 012 2v14" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[10px] font-medium tracking-tight">Recortar</span>
</button>
<!-- 3. Filtros -->
<button class="tool-tab flex flex-col items-center gap-1 min-w-[56px] py-1 text-neutral-400 hover:text-white" data-tool="filtros" type="button">
<div class="w-10 h-8 rounded-xl flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 8c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm-5.5 8c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm11 0c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[10px] font-medium tracking-tight">Filtros</span>
</button>
<!-- 4. Retoque -->
<button class="tool-tab flex flex-col items-center gap-1 min-w-[56px] py-1 text-neutral-400 hover:text-white" data-tool="retoque" type="button">
<div class="w-10 h-8 rounded-xl flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[10px] font-medium tracking-tight">Retoque</span>
</button>
<!-- 5. Texto -->
<button class="tool-tab flex flex-col items-center gap-1 min-w-[56px] py-1 text-neutral-400 hover:text-white" data-tool="texto" type="button">
<div class="w-10 h-8 rounded-xl flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4 6h16M12 6v14" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</div>
<span class="text-[10px] font-medium tracking-tight">Texto</span>
</button>
<!-- 6. Fondo -->
<button class="tool-tab flex flex-col items-center gap-1 min-w-[56px] py-1 text-neutral-400 hover:text-white" data-tool="fondo" type="button">
<div class="w-10 h-8 rounded-xl flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<rect height="18" rx="2" stroke-width="2" width="18" x="3" y="3"></rect>
<line stroke-width="1.5" x1="3" x2="21" y1="9" y2="9"></line>
<line stroke-width="1.5" x1="9" x2="9" y1="3" y2="21"></line>
</svg>
</div>
<span class="text-[10px] font-medium tracking-tight">Fondo</span>
</button>
</section>
<!-- END: ToolCategoriesBar -->
<!-- BEGIN: AdjustmentBottomSheet -->
<!-- Panel inferior de Ajustes (Bottom Sheet) -->
<section class="bg-brand-surface rounded-t-3xl p-5 pb-6 border-t border-white/10 shadow-2xl flex flex-col gap-4 z-20" data-purpose="adjustment-panel">
<!-- Encabezado de la tarjeta con flecha colapsar -->
<div class="flex items-center justify-between pb-1">
<h2 class="text-sm font-semibold tracking-wide text-neutral-100">Ajustes</h2>
<button aria-label="Colapsar panel" class="text-neutral-400 hover:text-white transition-colors" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
<!-- Controles deslizantes (Sliders) -->
<div class="flex flex-col gap-3.5" data-purpose="sliders-list">
<!-- Control 1: Brillo -->
<div class="flex items-center gap-3">
<!-- Icono de Sol -->
<div class="w-5 text-neutral-400 flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="5" stroke-width="2"></circle>
<line stroke-linecap="round" stroke-width="2" x1="12" x2="12" y1="1" y2="3"></line>
<line stroke-linecap="round" stroke-width="2" x1="12" x2="12" y1="21" y2="23"></line>
<line stroke-linecap="round" stroke-width="2" x1="4.22" x2="5.64" y1="4.22" y2="5.64"></line>
<line stroke-linecap="round" stroke-width="2" x1="18.36" x2="19.78" y1="18.36" y2="19.78"></line>
<line stroke-linecap="round" stroke-width="2" x1="1" x2="3" y1="12" y2="12"></line>
<line stroke-linecap="round" stroke-width="2" x1="21" x2="23" y1="12" y2="12"></line>
<line stroke-linecap="round" stroke-width="2" x1="4.22" x2="5.64" y1="19.78" y2="18.36"></line>
<line stroke-linecap="round" stroke-width="2" x1="18.36" x2="19.78" y1="5.64" y2="4.22"></line>
</svg>
</div>
<span class="text-xs font-normal text-neutral-300 w-16">Brillo</span>
<div class="flex-1 flex items-center">
<input class="w-full accent-brand-purple cursor-pointer" id="slider-brightness" max="50" min="-50" type="range" value="15"/>
</div>
<span class="text-xs font-mono text-neutral-300 w-7 text-right" id="value-brightness">+15</span>
</div>
<!-- Control 2: Contraste -->
<div class="flex items-center gap-3">
<!-- Icono de Medio Tono -->
<div class="w-5 text-neutral-400 flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9" stroke-width="2"></circle>
<path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path>
</svg>
</div>
<span class="text-xs font-normal text-neutral-300 w-16">Contraste</span>
<div class="flex-1 flex items-center">
<input class="w-full accent-brand-purple cursor-pointer" id="slider-contrast" max="50" min="-50" type="range" value="10"/>
</div>
<span class="text-xs font-mono text-neutral-300 w-7 text-right" id="value-contrast">+10</span>
</div>
<!-- Control 3: Saturación -->
<div class="flex items-center gap-3">
<!-- Icono de Gota -->
<div class="w-5 text-neutral-400 flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-xs font-normal text-neutral-300 w-16">Saturación</span>
<div class="flex-1 flex items-center">
<input class="w-full accent-brand-purple cursor-pointer" id="slider-saturation" max="50" min="-50" type="range" value="20"/>
</div>
<span class="text-xs font-mono text-neutral-300 w-7 text-right" id="value-saturation">+20</span>
</div>
</div>
</section>
<!-- END: AdjustmentBottomSheet -->
<!-- BEGIN: AndroidGestureBar -->
<!-- Barra de navegación por gestos Android -->
<footer class="w-full bg-brand-surface py-2 flex justify-center items-center" data-purpose="gesture-navigation-bar">
<div class="w-28 h-1 bg-neutral-400/60 rounded-full"></div>
</footer>
<!-- END: AndroidGestureBar -->
</main>
<!-- END: DeviceContainer -->
<!-- BEGIN: InteractiveScript -->
<script data-purpose="editor-interactivity">
    document.addEventListener('DOMContentLoaded', () => {
      // Elementos de la imagen y sliders
      const photoPreview = document.getElementById('photo-preview');
      const brightnessSlider = document.getElementById('slider-brightness');
      const contrastSlider = document.getElementById('slider-contrast');
      const saturationSlider = document.getElementById('slider-saturation');

      const brightnessVal = document.getElementById('value-brightness');
      const contrastVal = document.getElementById('value-contrast');
      const saturationVal = document.getElementById('value-saturation');

      const compareBtn = document.getElementById('compare-btn');

      // Función para actualizar los filtros dinámicos en vivo
      function updateFilters() {
        const b = parseInt(brightnessSlider.value, 10);
        const c = parseInt(contrastSlider.value, 10);
        const s = parseInt(saturationSlider.value, 10);

        brightnessVal.textContent = (b > 0 ? '+' : '') + b;
        contrastVal.textContent = (c > 0 ? '+' : '') + c;
        saturationVal.textContent = (s > 0 ? '+' : '') + s;

        // Conversión a valores CSS
        const cssBrightness = 1 + (b / 100);
        const cssContrast = 1 + (c / 100);
        const cssSaturate = 1 + (s / 100);

        photoPreview.style.filter = `brightness(${cssBrightness}) contrast(${cssContrast}) saturate(${cssSaturate})`;
      }

      // Event listeners para los controles deslizantes
      brightnessSlider.addEventListener('input', updateFilters);
      contrastSlider.addEventListener('input', updateFilters);
      saturationSlider.addEventListener('input', updateFilters);

      // Botón comparar: mantén presionado para ver el original sin filtros
      let isComparing = false;
      function showOriginal() {
        isComparing = true;
        photoPreview.style.filter = 'brightness(1) contrast(1) saturate(1)';
        compareBtn.classList.add('bg-brand-purple', 'text-white');
      }

      function restoreEdited() {
        if (!isComparing) return;
        isComparing = false;
        updateFilters();
        compareBtn.classList.remove('bg-brand-purple', 'text-white');
      }

      compareBtn.addEventListener('mousedown', showOriginal);
      window.addEventListener('mouseup', restoreEdited);
      compareBtn.addEventListener('touchstart', showOriginal);
      window.addEventListener('touchend', restoreEdited);

      // Selección de pestañas de herramientas
      const toolTabs = document.querySelectorAll('.tool-tab');
      toolTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          toolTabs.forEach(t => {
            t.classList.remove('text-brand-purple');
            t.classList.add('text-neutral-400');
            const iconBg = t.querySelector('div');
            if (iconBg) iconBg.classList.remove('bg-brand-purple/20');
          });

          tab.classList.add('text-brand-purple');
          tab.classList.remove('text-neutral-400');
          const activeIconBg = tab.querySelector('div');
          if (activeIconBg) activeIconBg.classList.add('bg-brand-purple/20');
        });
      });
    });
  </script>
<!-- END: InteractiveScript -->
</body></html>
