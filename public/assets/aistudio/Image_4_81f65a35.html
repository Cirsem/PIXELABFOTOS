<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PIXELAB - Editor Creativo y Capas</title>
<!-- Tailwind CSS CDN con plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Roboto & Material Symbols Outlined -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style data-purpose="custom-config">
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #0d0c11;
      user-select: none;
      -webkit-user-select: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
    }
    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1;
    }
    /* Estilo del collage vaporwave / glitch */
    .collage-canvas-bg {
      background: radial-gradient(circle at 50% 35%, #7e46c7 0%, #3e1b71 55%, #190933 100%);
    }
    /* Ocultar barra de desplazamiento */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 text-white">
<!-- BEGIN: PhoneFrame -->
<main class="w-full max-w-[412px] h-[892px] bg-[#121118] sm:rounded-[44px] shadow-2xl relative flex flex-col overflow-hidden border border-white/5" data-purpose="mobile-viewport">
<!-- BEGIN: AndroidStatusBar -->
<header class="w-full pt-3 px-6 pb-2 flex justify-between items-center text-sm font-medium z-30 select-none tracking-tight text-white/90" data-purpose="status-bar">
<!-- Hora actual -->
<span class="text-sm font-semibold tracking-wide">9:30</span>
<!-- Indicadores de sistema -->
<div class="flex items-center space-x-2 text-white/90">
<span class="material-symbols-outlined text-[17px]">network_wifi</span>
<span class="material-symbols-outlined text-[17px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[19px]">battery_full</span>
</div>
</header>
<!-- END: AndroidStatusBar -->
<!-- BEGIN: TopNavigationBar -->
<nav class="w-full px-4 py-2 flex items-center justify-between z-20" data-purpose="top-action-bar">
<!-- Botón Volver -->
<button aria-label="Volver" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 active:scale-95 transition-all text-white/90" type="button">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<!-- Botones Deshacer y Rehacer -->
<div class="flex items-center space-x-3">
<button aria-label="Deshacer" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 active:scale-95 transition-all text-white/80" id="btn-undo" type="button">
<span class="material-symbols-outlined text-[22px]">undo</span>
</button>
<button aria-label="Rehacer" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 active:scale-95 transition-all text-white/80" id="btn-redo" type="button">
<span class="material-symbols-outlined text-[22px]">redo</span>
</button>
</div>
<!-- Botón Guardar Destacado -->
<button aria-label="Guardar proyecto" class="bg-[#8B5CF6] hover:bg-[#7c4deb] active:scale-95 text-white px-4 py-1.5 rounded-full flex items-center space-x-1.5 shadow-lg shadow-purple-600/30 transition-all font-medium text-sm" type="button">
<span class="material-symbols-outlined text-[18px]">download_done</span>
<span class="pr-0.5">Guardar</span>
</button>
</nav>
<!-- END: TopNavigationBar -->
<!-- BEGIN: WorkspaceArea -->
<section class="flex-1 flex px-3.5 pt-1 pb-2 gap-2.5 overflow-hidden" data-purpose="workspace-split">
<!-- BEGIN: CanvasContainer -->
<div class="flex-1 flex flex-col relative rounded-2xl overflow-hidden bg-[#181622] border border-white/5" data-purpose="canvas-area">
<!-- Lienzo de Composición Artística -->
<div class="relative flex-1 collage-canvas-bg overflow-hidden flex items-center justify-center select-none cursor-crosshair" id="artistic-canvas">
<!-- Capa 5 (Fondo texturizado morado / grano) -->
<div class="absolute inset-0 opacity-80 mix-blend-overlay pointer-events-none" id="layer-view-5" style="background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0); background-size: 8px 8px;"></div>
<!-- Capa Estrellas de fondo vectoriales secundarias -->
<div class="absolute top-16 left-6 text-purple-300/40 pointer-events-none select-none">
<svg class="w-10 h-10" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"></path>

</div>
<!-- Elemento decorativo: Ráfaga angular estilo pop-art / vaporwave -->

</svg>
</div>

<polygon fill="#1b1b1b" points="75,180 120,20 185,45 175,180" stroke="#777" stroke-width="1.5"></polygon>

<line stroke="#aaa" stroke-dasharray="2,3" stroke-width="0.75" x1="90" x2="170" y1="70" y2="90"></line>
<line stroke="#aaa" stroke-dasharray="2,3" stroke-width="0.75" x1="95" x2="165" y1="100" y2="120"></line>
<line stroke="#aaa" stroke-dasharray="2,3" stroke-width="0.75" x1="100" x2="160" y1="130" y2="150"></line>

<!-- Rasgos de sombra David -->

<div class="w-full h-[1px] bg-white/30"></div>

</div>

<!-- Tirador Superior Derecho -->
<div class="absolute -top-1.5 -right-1.5 w-3 h-3 bg-white border border-purple-600 rounded-sm shadow"></div>
<!-- Tirador Inferior Izquierdo -->
<div class="absolute -bottom-1.5 -left-1.5 w-3 h-3 bg-white border border-purple-600 rounded-sm shadow"></div>
<!-- Tirador Inferior Derecho -->
<div class="absolute -bottom-1.5 -right-1.5 w-3 h-3 bg-white border border-purple-600 rounded-sm shadow"></div>

<svg class="w-14 h-14 text-white drop-shadow-[0_2px_8px_rgba(139,92,246,0.8)]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
</svg>
</div>
</div>
<!-- Pequeño garabato adicional de estrella en estilo fanzine -->
<div class="absolute bottom-24 left-4 text-purple-200/70 z-20 pointer-events-none rotate-[-15deg]">
<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24">
<polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9 12 2"></polygon>
</svg>
</div>
<!-- BEGIN: FloatingCanvasTools -->
<div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-[#1f1d2b]/90 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center space-x-3 border border-white/10 shadow-xl z-40" data-purpose="quick-canvas-nav">
<button class="text-white/70 hover:text-white active:scale-90 transition-all flex items-center" title="Mover lienzo" type="button">
<span class="material-symbols-outlined text-[19px]">pan_tool</span>
</button>
<button class="text-white/70 hover:text-white active:scale-90 transition-all flex items-center" title="Zoom" type="button">
<span class="material-symbols-outlined text-[19px]">zoom_in</span>
</button>
<button class="text-white/70 hover:text-white active:scale-90 transition-all flex items-center" title="Ajustar a pantalla" type="button">
<span class="material-symbols-outlined text-[19px]">crop_free</span>
</button>
</div>
<!-- END: FloatingCanvasTools -->
</div>
</div>

<aside class="w-[118px] bg-[#1a1824] rounded-2xl p-2 flex flex-col justify-between border border-white/5 shadow-inner" data-purpose="layers-sidebar">

<div class="flex items-center justify-between px-1 pb-2 pt-0.5 border-b border-white/5">

<button class="w-6 h-6 flex items-center justify-center rounded hover:bg-white/10 active:scale-95 text-purple-400" id="btn-add-layer" title="Nueva capa" type="button">

</button>
</div>
<!-- Lista Vertical de Capas Apilables -->
<div class="flex-1 my-2 flex flex-col space-y-1.5 overflow-y-auto no-scrollbar" data-purpose="layer-item-list" id="layers-stack">
<!-- Capa 1: Estrella activa -->
<div class="layer-item active group relative bg-[#242132] hover:bg-[#2b273d] border-2 border-[#8B5CF6] rounded-xl p-1.5 flex items-center justify-between cursor-pointer transition-all" data-layer-id="1">
<div class="w-10 h-10 rounded-lg bg-[#191724] border border-white/10 flex items-center justify-center overflow-hidden">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
</svg>
</div>
<button class="eye-toggle text-gray-300 hover:text-white p-1 rounded transition-colors" title="Visibilidad" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
<!-- Capa 2: Rectángulo morado -->
<div class="layer-item group relative bg-[#201d2d] hover:bg-[#262335] border border-transparent rounded-xl p-1.5 flex items-center justify-between cursor-pointer transition-all" data-layer-id="2">
<div class="w-10 h-10 rounded-lg bg-[#8B5CF6] border border-purple-400/30 flex items-center justify-center shadow-inner">
</div>
<button class="eye-toggle text-gray-400 hover:text-white p-1 rounded transition-colors" title="Visibilidad" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
<!-- Capa 3: Recorte busto David -->
<div class="layer-item group relative bg-[#201d2d] hover:bg-[#262335] border border-transparent rounded-xl p-1.5 flex items-center justify-between cursor-pointer transition-all" data-layer-id="3">
<div class="w-10 h-10 rounded-lg bg-[#2c283d] border border-white/10 flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-[26px] text-gray-300">person</span>
</div>
<button class="eye-toggle text-gray-400 hover:text-white p-1 rounded transition-colors" title="Visibilidad" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
<!-- Capa 4: Edificios B/N (Bloqueada) -->
<div class="layer-item group relative bg-[#201d2d] hover:bg-[#262335] border border-transparent rounded-xl p-1.5 flex items-center justify-between cursor-pointer transition-all" data-layer-id="4">
<div class="w-10 h-10 rounded-lg bg-[#17161f] border border-white/10 flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-[24px] text-gray-400">apartment</span>
</div>
<button class="lock-toggle text-gray-400 hover:text-purple-400 p-1 rounded transition-colors" title="Capa bloqueada" type="button">
<span class="material-symbols-outlined text-[17px]">lock</span>
</button>
</div>
<!-- Capa 5: Fondo Violeta textura -->
<div class="layer-item group relative bg-[#201d2d] hover:bg-[#262335] border border-transparent rounded-xl p-1.5 flex items-center justify-between cursor-pointer transition-all" data-layer-id="5">
<div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#6b31af] to-[#391763] border border-purple-400/20 flex items-center justify-center">
</div>
<button class="eye-toggle text-gray-400 hover:text-white p-1 rounded transition-colors" title="Visibilidad" type="button">

</button>
</div>
</div>

<div class="pt-2 border-t border-white/5 flex items-center justify-around text-gray-400" data-purpose="layer-quick-actions">

</button>

</button>

<div class="flex items-center justify-around overflow-x-auto no-scrollbar gap-1 py-1" id="tools-container">
<!-- Herramienta 1: Selección (Activa por defecto) -->

<span class="material-symbols-outlined text-[23px] group-hover:scale-110 transition-transform">select</span>
<span class="text-[11px] font-medium mt-1">Selección</span>
</button>
<!-- Herramienta 2: Máscara -->
<button class="tool-btn flex flex-col items-center justify-center min-w-[62px] py-1 text-gray-400 hover:text-gray-200 transition-all group" data-tool="mascara" type="button">
<span class="material-symbols-outlined text-[23px] group-hover:scale-110 transition-transform">filter_center_focus</span>
<span class="text-[11px] font-medium mt-1">Máscara</span>
</button>
<!-- Herramienta 3: Transformar -->
<button class="tool-btn flex flex-col items-center justify-center min-w-[62px] py-1 text-gray-400 hover:text-gray-200 transition-all group" data-tool="transformar" type="button">
<span class="material-symbols-outlined text-[23px] group-hover:scale-110 transition-transform">open_with</span>
<span class="text-[11px] font-medium mt-1">Transformar</span>
</button>
<!-- Herramienta 4: Desenfocar -->
<button class="tool-btn flex flex-col items-center justify-center min-w-[62px] py-1 text-gray-400 hover:text-gray-200 transition-all group" data-tool="desenfocar" type="button">
<span class="material-symbols-outlined text-[23px] group-hover:scale-110 transition-transform">water_drop</span>
<span class="text-[11px] font-medium mt-1">Desenfocar</span>
</button>
<!-- Herramienta 5: Ajustes -->
<button class="tool-btn flex flex-col items-center justify-center min-w-[62px] py-1 text-gray-400 hover:text-gray-200 transition-all group" data-tool="ajustes" type="button">
<span class="material-symbols-outlined text-[23px] group-hover:scale-110 transition-transform">auto_fix_high</span>
<span class="text-[11px] font-medium mt-1">Ajustes</span>
</button>
</div>
<!-- Barra de Gestos de Android (Home Indicator) -->
<div class="w-full flex justify-center py-2" data-purpose="android-gesture-pill">
<div class="w-32 h-1 bg-white/40 rounded-full"></div>
</div>
</footer>
<!-- END: BottomToolbar -->
</main>
<!-- END: PhoneFrame -->
<!-- BEGIN: InteractiveHandlersScript -->
<script data-purpose="interactive-layers-and-tools">
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Alternar Visibilidad de Capas
      const eyeButtons = document.querySelectorAll('.eye-toggle');
      eyeButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const layerCard = btn.closest('.layer-item');
          const layerId = layerCard.getAttribute('data-layer-id');
          const canvasElement = document.getElementById(`layer-view-${layerId}`);
          const iconSpan = btn.querySelector('.material-symbols-outlined');

          if (canvasElement) {
            const isHidden = canvasElement.classList.contains('opacity-0');
            if (isHidden) {
              // Mostrar capa
              canvasElement.classList.remove('opacity-0', 'pointer-events-none');
              iconSpan.textContent = 'visibility';
              btn.classList.remove('text-purple-400', 'opacity-50');
              btn.classList.add('text-gray-300');
            } else {
              // Ocultar capa
              canvasElement.classList.add('opacity-0', 'pointer-events-none');
              iconSpan.textContent = 'visibility_off';
              btn.classList.remove('text-gray-300');
              btn.classList.add('text-purple-400', 'opacity-70');
            }
          }
        });
      });

      // 2. Selección de Capa Activa
      const layerItems = document.querySelectorAll('.layer-item');
      layerItems.forEach(item => {
        item.addEventListener('click', () => {
          layerItems.forEach(l => {
            l.classList.remove('border-[#8B5CF6]', 'bg-[#242132]');
            l.classList.add('border-transparent', 'bg-[#201d2d]');
          });
          item.classList.remove('border-transparent', 'bg-[#201d2d]');
          item.classList.add('border-[#8B5CF6]', 'bg-[#242132]');

          // Mostrar u ocultar la caja de transformación en base a la capa 1
          const layerId = item.getAttribute('data-layer-id');
          const activeTransform = document.querySelector('[data-purpose="active-transform-box"]');
          if (activeTransform) {
            if (layerId === '1') {
              activeTransform.classList.remove('opacity-60');
            } else {
              activeTransform.classList.add('opacity-60');
            }
          }
        });
      });

      // 3. Selección de Herramientas Inferiores
      const toolButtons = document.querySelectorAll('.tool-btn');
      toolButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          toolButtons.forEach(b => {
            b.classList.remove('text-[#8B5CF6]');
            b.classList.add('text-gray-400');
          });
          btn.classList.remove('text-gray-400');
          btn.classList.add('text-[#8B5CF6]');
        });
      });

      // 4. Bloqueo Toggle (Capa 4)
      const lockButtons = document.querySelectorAll('.lock-toggle');
      lockButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const icon = btn.querySelector('.material-symbols-outlined');
          if (icon.textContent === 'lock') {
            icon.textContent = 'lock_open';
            btn.classList.add('text-purple-400');
          } else {
            icon.textContent = 'lock';
            btn.classList.remove('text-purple-400');
          }
        });
      });
    });
  </script>
<!-- END: InteractiveHandlersScript -->
</body></html>
