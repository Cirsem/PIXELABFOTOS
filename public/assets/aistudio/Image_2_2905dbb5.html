<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>PIXELAB - Inicio</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter & Roboto -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appDark: '#121215',
            appCard: '#1E1E24',
            appCardHover: '#26262F',
            appPurple: '#8B5CF6',
            appPurpleDark: '#6D28D9',
            appPurpleLight: '#A78BFA',
            subText: '#9CA3AF'

          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']

<!-- BEGIN: Custom App Styles -->
<style data-purpose="app-core-styles">
    body {
      background-color: #0b0b0e;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Ocultar barra de desplazamiento nativa para scroll horizontal */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Efectos de elevación y brillos morados suaves */
    .glow-purple {
      box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
    }

<!-- END: Custom App Styles -->
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-white">
<!-- BEGIN: Phone Frame Device Container -->
<div class="w-full max-w-[412px] h-[100dvh] sm:h-[870px] bg-appDark sm:rounded-[44px] overflow-hidden flex flex-col relative shadow-2xl border sm:border-[#2C2C35]">

<header class="w-full px-6 pt-3.5 pb-2 flex justify-between items-center text-xs tracking-wide font-medium text-white z-30 select-none" data-purpose="status-bar">

<!-- Iconos de estado: Señal, Wifi, Batería -->

<path d="M12 4C7.58 4 4 7.58 4 12c0 2.09.8 4 2.13 5.46L12 21.08l5.87-3.62C19.2 16 20 14.09 20 12c0-4.42-3.58-8-8-8z"></path>

<!-- END: Android System Status Bar -->
<!-- BEGIN: Main Scrollable Content -->

</svg>

              a tus <span class="text-appPurpleLight italic font-bold">ideas</span>
</h1>

<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>

<img alt="Playa con cielo atardecer violeta" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAiK0IpM5Feb5_8xv1DgTS0-OEkxrbh96sk7u120li7eitUp5EMc-dpt-bTJHev7omRICmzfLoIZQNOFnnGfOs0KCk9RgPDwdJpnbTvpSzo3JnSVd7XydfI7WuB4zCZBYi7D7yU_YkiQRARE5sVG-v0ObHClH9qHawxHZqKabWWer47fJdTwumP6MdG2-7sttgZDRibMCnPB40tebm24g1CcKxH0qhPoiIx2eD9GLHo"/>

<section class="space-y-3" data-purpose="quick-tools">

<h2 class="text-base font-bold text-white tracking-wide">Herramientas rápidas</h2>

<path d="M6.115 5.115a.75.75 0 011.06 0l11.71 11.71a.75.75 0 010 1.06l-.53.53a.75.75 0 01-1.06 0L6.645 6.705a.75.75 0 010-1.06l.53-.53z" opacity="0" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M6 3v13a2 2 0 002 2h13" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M18 21V8a2 2 0 00-2-2H3" stroke-linecap="round" stroke-linejoin="round"></path>

<path d="M3 18h4M11 18h10M13 18a2 2 0 104 0 2 2 0 00-4 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>

<span class="text-[11px] font-medium text-gray-300 mt-1">Filtros</span>

<!-- Herramienta 3: Eliminar fondo -->

<div class="w-10 h-10 flex items-center justify-center text-gray-200 group-hover:text-appPurpleLight transition-colors">

</div>
</div>
<span class="text-[10px] leading-tight font-medium text-gray-300 mt-1 text-center">Eliminar fondo</span>
</button>
<!-- Herramienta 4: Retoque -->
<button class="flex flex-col items-center justify-center p-3 rounded-2xl bg-appCard hover:bg-appCardHover active:scale-95 transition-all border border-white/5 group">
<div class="w-10 h-10 flex items-center justify-center text-gray-200 group-hover:text-appPurpleLight transition-colors">
<!-- Icono Gota / Retoque -->
<svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">

</svg>

</div>

<!-- BEGIN: Bottom Navigation Bar -->
<nav class="w-full bg-[#16161B]/95 backdrop-blur-md border-t border-[#25252D] px-6 py-2 pb-5 flex items-center justify-around z-20" data-purpose="bottom-navigation">
<!-- Pestaña 1: Inicio (Activa) -->
<button class="flex flex-col items-center group relative cursor-pointer">
<div class="px-5 py-1 rounded-full bg-appPurple/20 text-appPurpleLight flex items-center justify-center transition-all">
<!-- Icono Home relleno -->
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
</svg>
</div>
<span class="text-[11px] font-semibold text-appPurpleLight mt-1">Inicio</span>
</button>
<!-- Pestaña 2: Proyectos -->
<button class="flex flex-col items-center group text-subText hover:text-white transition-colors cursor-pointer">
<div class="px-5 py-1 rounded-full flex items-center justify-center">
<!-- Icono Carpeta -->
<svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium mt-1">Proyectos</span>
</button>
<!-- Pestaña 3: Perfil -->
<button class="flex flex-col items-center group text-subText hover:text-white transition-colors cursor-pointer">
<div class="px-5 py-1 rounded-full flex items-center justify-center">
<!-- Icono Usuario -->
<svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium mt-1">Perfil</span>
</button>
</nav>
<!-- END: Bottom Navigation Bar -->
<!-- BEGIN: Android Gesture Navigation Bar Indicator -->
<div class="w-full flex justify-center pb-2 pt-1 bg-[#16161B]" data-purpose="android-gesture-bar">

</div>

</div>
<!-- END: Phone Frame Device Container -->
<!-- BEGIN: Script de Microinteracción -->
<script data-purpose="navigation-interactivity">
    // Simulación de respuesta háptica o feedback visual básico
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', () => {
        button.classList.add('opacity-80');
        setTimeout(() => button.classList.remove('opacity-80'), 150);
      });
    });
  </script>
<!-- END: Script de Microinteracción -->
